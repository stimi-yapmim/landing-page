services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_URI: ${MONGODB_URI}
    image: stimi-yapmi-web:latest
    container_name: stimi_yapmi_web
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
    volumes:
      - stimi_images:/app/public/images
      - stimi_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  stimi_images:
  stimi_uploads: