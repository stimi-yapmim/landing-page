services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: stimi-yapmi-web:latest
    container_name: stimi_yapmi_web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
